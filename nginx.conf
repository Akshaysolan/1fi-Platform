server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed static assets aggressively
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # React Router uses client-side routes (e.g. /marketplace/product/p1),
    # so any unmatched path falls back to index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
